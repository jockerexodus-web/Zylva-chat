<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Zylva Labs — Chat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ ÉCRAN 1 : PSEUDO ============ -->
  <div id="loginScreen" class="screen active">
    <div class="auth-box">
      <div class="logo-container">
        <img src="logo.svg" alt="Zylva Labs" class="brand-logo">
      </div>
      <h1 class="brand-name">zylva<span>labs</span></h1>
      <p class="tagline">Choisis ton pseudo et discute</p>

      <div class="input-group">
        <label>Pseudo</label>
        <input type="text" id="usernameInput" placeholder="Ton nom..." maxlength="20" autocomplete="off">
      </div>

      <button id="enterBtn" class="btn-primary">Rejoindre le chat</button>

      <p class="legal">
        Aucune inscription. Juste ton pseudo et c'est parti.
      </p>
    </div>
  </div>

  <!-- ============ ÉCRAN 2 : CHAT ============ -->
  <div id="appScreen" class="screen">
    <header class="app-header">
      <div class="user-info">
        <div class="avatar" id="userAvatar">?</div>
        <div>
          <div class="username" id="currentUser"></div>
          <div class="status">🟢 En ligne</div>
        </div>
      </div>
      <div class="header-brand">
        <img src="logo.svg" alt="Zylva" height="30">
      </div>
      <button id="logoutBtn" title="Quitter">⏻</button>
    </header>

    <div class="chat-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>💬 Discussions</h2>
          <input type="text" id="searchInput" placeholder="Rechercher...">
        </div>
        <ul id="contactList"></ul>
      </aside>

      <main class="chat-area">
        <div class="chat-header" id="chatHeader">
          <button id="backToSidebar" class="mobile-back hidden">←</button>
          <span id="chatWith">Sélectionne une discussion</span>
        </div>
        <div class="messages" id="messages">
          <div class="empty-state">
            <img src="logo.svg" alt="" class="empty-logo">
            <p>Bienvenue sur <strong>Zylva Labs</strong></p>
            <p class="small">Sélectionne un contact pour commencer</p>
          </div>
        </div>
        <div class="input-area">
          <button id="emojiBtn" title="Emoji">😀</button>
          <input type="text" id="messageInput" placeholder="Écris un message..." autocomplete="off">
          <button id="sendBtn">➤</button>
        </div>
      </main>
    </div>
  </div>

  <div id="emojiPicker" class="emoji-picker hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
